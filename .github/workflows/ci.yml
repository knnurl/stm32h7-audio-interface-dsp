# Builds the DSP library and runs its tests on the PC, and builds the firmware for both cores.
# Nothing here needs the board. It runs once the repository exists on GitHub.
name: ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r tests/requirements.txt
      - run: cmake --preset host
      - run: cmake --build --preset host-release
      - run: python -m pytest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - shell: pwsh
        run: ./fw/fetch_deps.ps1
      - run: cmake --preset fw
      - run: cmake --build --preset fw
