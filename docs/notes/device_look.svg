<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <rect width="1000" height="1080" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="600" fill="#1a1a1a">Rev A in an enclosure: draft product sketch</text>
  <text x="40" y="56" fill="#555">Desktop box, about 170 wide x 55 high x 140 deep (mm). Sizes, positions and parts are not final.</text>

  <!-- ============ 1. Front panel ============ -->
  <text x="40" y="90" font-size="15" font-weight="600" fill="#1f6f43">1. Front panel: signal flows left to right</text>
  <rect x="40" y="102" width="850" height="262" rx="10" fill="#20242a" stroke="#0e1013" stroke-width="2"/>
  <g fill="#3d444d"><circle cx="54" cy="116" r="4"/><circle cx="876" cy="116" r="4"/><circle cx="54" cy="350" r="4"/><circle cx="876" cy="350" r="4"/></g>

  <g font-size="11" fill="#8b949e" text-anchor="middle" font-weight="600" letter-spacing="1.5">
    <text x="97" y="128">INPUT</text><text x="243" y="128">DISPLAY</text><text x="410" y="128">EFFECT</text>
    <text x="593" y="128">TONE</text><text x="795" y="128">OUTPUT</text>
  </g>
  <g stroke="#444c56" stroke-width="1">
    <line x1="152" y1="140" x2="152" y2="345"/><line x1="335" y1="140" x2="335" y2="345"/>
    <line x1="485" y1="140" x2="485" y2="345"/><line x1="700" y1="140" x2="700" y2="345"/>
  </g>

  <!-- INPUT: LEDs and blend -->
  <g font-size="10" fill="#c9d1d9" text-anchor="middle">
    <text x="70" y="150">1</text><text x="98" y="150">2</text>
    <text x="112" y="168" text-anchor="start">CLIP</text><text x="112" y="190" text-anchor="start">SIG</text>
  </g>
  <circle cx="70" cy="164" r="5" fill="#e5484d"/><circle cx="98" cy="164" r="5" fill="#e5484d"/>
  <circle cx="70" cy="186" r="5" fill="#46a758"/><circle cx="98" cy="186" r="5" fill="#46a758"/>
  <circle cx="97" cy="262" r="24" fill="#e6e8eb" stroke="#0e1013" stroke-width="2"/>
  <line x1="97" y1="262" x2="97" y2="242" stroke="#20242a" stroke-width="4" stroke-linecap="round"/>
  <text x="97" y="308" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">BLEND</text>
  <text x="97" y="326" font-size="10" fill="#8b949e" text-anchor="middle">INPUT / PC</text>

  <!-- DISPLAY -->
  <rect x="178" y="146" width="130" height="62" rx="3" fill="#05070a" stroke="#555"/>
  <text x="243" y="173" fill="#7fd1ff" font-size="11" text-anchor="middle">ECHO  375 ms</text>
  <text x="243" y="191" fill="#7fd1ff" font-size="10" text-anchor="middle">120.0 BPM   48 kHz</text>
  <circle cx="208" cy="262" r="17" fill="#3a4048" stroke="#888"/><circle cx="278" cy="262" r="17" fill="#3a4048" stroke="#888"/>
  <g font-size="10" fill="#c9d1d9" text-anchor="middle"><text x="208" y="302">SELECT</text><text x="278" y="302">VALUE</text></g>
  <text x="243" y="326" font-size="10" fill="#8b949e" text-anchor="middle">PRESETS AND SETUP</text>

  <!-- EFFECT -->
  <g fill="#d0d7de" stroke="#6e7781">
    <rect x="348" y="158" width="34" height="24" rx="4"/><rect x="393" y="158" width="34" height="24" rx="4"/><rect x="438" y="158" width="34" height="24" rx="4"/>
  </g>
  <circle cx="410" cy="148" r="4" fill="#3b82f6"/>
  <g font-size="10" fill="#c9d1d9" text-anchor="middle"><text x="365" y="198">SELECT</text><text x="410" y="198">ON</text><text x="455" y="198">TAP</text></g>
  <circle cx="410" cy="262" r="27" fill="#e6e8eb" stroke="#0e1013" stroke-width="2"/>
  <line x1="410" y1="262" x2="425" y2="247" stroke="#20242a" stroke-width="4" stroke-linecap="round"/>
  <text x="410" y="312" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">AMOUNT</text>

  <!-- TONE -->
  <g fill="#e6e8eb" stroke="#0e1013" stroke-width="2">
    <circle cx="525" cy="262" r="27"/><circle cx="593" cy="262" r="27"/><circle cx="661" cy="262" r="27"/>
  </g>
  <g stroke="#20242a" stroke-width="4" stroke-linecap="round">
    <line x1="525" y1="262" x2="525" y2="240"/><line x1="593" y1="262" x2="593" y2="240"/><line x1="661" y1="262" x2="661" y2="240"/>
  </g>
  <g stroke="#8b949e" stroke-width="2"><line x1="525" y1="226" x2="525" y2="220"/><line x1="593" y1="226" x2="593" y2="220"/><line x1="661" y1="226" x2="661" y2="220"/></g>
  <g font-size="11" fill="#fff" text-anchor="middle" font-weight="600"><text x="525" y="312">BASS</text><text x="593" y="312">MID</text><text x="661" y="312">TREBLE</text></g>
  <text x="593" y="330" font-size="10" fill="#8b949e" text-anchor="middle">+/-12 dB, FLAT AT CENTRE</text>
  <text x="593" y="172" font-size="10" fill="#8b949e" text-anchor="middle">monitors and headphones only,</text>
  <text x="593" y="186" font-size="10" fill="#8b949e" text-anchor="middle">never recorded</text>

  <!-- OUTPUT -->
  <g fill="#d0d7de" stroke="#6e7781"><rect x="788" y="158" width="34" height="24" rx="4"/><rect x="838" y="158" width="34" height="24" rx="4"/></g>
  <circle cx="805" cy="148" r="4" fill="#e5484d"/><circle cx="855" cy="148" r="4" fill="#f5a524"/>
  <g font-size="10" fill="#c9d1d9" text-anchor="middle"><text x="805" y="198">MUTE</text><text x="855" y="198">DIM</text></g>
  <circle cx="738" cy="170" r="14" fill="#0e1013" stroke="#aaa" stroke-width="3"/>
  <text x="738" y="200" font-size="10" fill="#c9d1d9" text-anchor="middle">PHONES</text>
  <circle cx="738" cy="266" r="22" fill="#e6e8eb" stroke="#0e1013" stroke-width="2"/>
  <line x1="738" y1="266" x2="726" y2="253" stroke="#20242a" stroke-width="4" stroke-linecap="round"/>
  <text x="738" y="308" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">PHONES</text>
  <circle cx="830" cy="262" r="36" fill="#e6e8eb" stroke="#0e1013" stroke-width="2"/>
  <line x1="830" y1="262" x2="810" y2="242" stroke="#20242a" stroke-width="5" stroke-linecap="round"/>
  <text x="830" y="322" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">MONITOR</text>

  <!-- ============ 2. Rear panel ============ -->
  <text x="40" y="410" font-size="15" font-weight="600" fill="#1f6f43">2. Rear panel: every cable leaves from the back</text>
  <rect x="40" y="422" width="850" height="150" rx="10" fill="#20242a" stroke="#0e1013" stroke-width="2"/>
  <g fill="#3d444d"><circle cx="54" cy="436" r="4"/><circle cx="876" cy="436" r="4"/><circle cx="54" cy="558" r="4"/><circle cx="876" cy="558" r="4"/></g>

  <rect x="68" y="470" width="30" height="44" rx="3" fill="#0e1013" stroke="#888"/><rect x="72" y="474" width="22" height="18" fill="#e5484d"/>
  <circle cx="150" cy="492" r="14" fill="#0e1013" stroke="#aaa" stroke-width="3"/><circle cx="150" cy="492" r="4" fill="#aaa"/>
  <rect x="204" y="482" width="46" height="20" rx="10" fill="#0e1013" stroke="#aaa" stroke-width="2"/>
  <circle cx="305" cy="492" r="14" fill="#0e1013" stroke="#aaa" stroke-width="3"/>
  <rect x="368" y="476" width="34" height="32" rx="3" fill="#0e1013" stroke="#666"/><rect x="378" y="486" width="14" height="12" fill="#555"/>
  <rect x="428" y="476" width="34" height="32" rx="3" fill="#0e1013" stroke="#666"/><rect x="438" y="486" width="14" height="12" fill="#e5484d"/>
  <g fill="#0e1013" stroke="#aaa" stroke-width="4">
    <circle cx="545" cy="492" r="17"/><circle cx="620" cy="492" r="17"/><circle cx="740" cy="492" r="17"/><circle cx="815" cy="492" r="17"/>
  </g>
  <g font-size="10" fill="#c9d1d9" text-anchor="middle">
    <text x="83" y="534">POWER</text><text x="150" y="534">12 V DC</text><text x="227" y="534">USB-C</text><text x="305" y="534">FOOT SW</text>
    <text x="385" y="534">IN</text><text x="445" y="534">OUT</text>
    <text x="545" y="534">1</text><text x="620" y="534">2</text><text x="740" y="534">L</text><text x="815" y="534">R</text>
  </g>
  <g font-size="11" fill="#8b949e" text-anchor="middle" font-weight="600" letter-spacing="1.5">
    <text x="415" y="454">OPTICAL</text><text x="582" y="454">LINE IN</text><text x="777" y="454">MONITOR OUT</text>
  </g>
  <text x="582" y="554" font-size="9" fill="#8b949e" text-anchor="middle">BALANCED, +4 dBu</text>
  <text x="777" y="554" font-size="9" fill="#8b949e" text-anchor="middle">BALANCED</text>

  <!-- ============ 3. Inside, top view ============ -->
  <text x="40" y="618" font-size="15" font-weight="600" fill="#1f6f43">3. Inside, from above (rear at the top)</text>
  <rect x="40" y="650" width="425" height="372" rx="6" fill="#f4f5f7" stroke="#20242a" stroke-width="3"/>

  <!-- rear connectors poking through the rear panel -->
  <g fill="#3a4048">
    <rect x="62" y="640" width="16" height="26"/><rect x="92" y="640" width="20" height="26"/><rect x="124" y="640" width="22" height="26"/>
    <rect x="160" y="640" width="20" height="26"/><rect x="198" y="640" width="18" height="26"/><rect x="226" y="640" width="18" height="26"/>
    <rect x="274" y="636" width="24" height="34"/><rect x="310" y="636" width="24" height="34"/>
    <rect x="368" y="636" width="24" height="34"/><rect x="404" y="636" width="24" height="34"/>
  </g>

  <!-- main board 160 x 100 -->
  <rect x="52" y="660" width="400" height="250" rx="3" fill="#e3f3e7" stroke="#1f6f43" stroke-width="2"/>
  <text x="62" y="902" fill="#1f6f43" font-weight="600" font-size="11">Main board, 160 x 100 mm</text>
  <rect x="60" y="678" width="110" height="52" rx="3" fill="#fde8d0" stroke="#c7772a"/><text x="68" y="708" font-size="10" fill="#7a4310">Power</text>
  <rect x="176" y="678" width="80" height="52" rx="3" fill="#dfe9fb" stroke="#3c63b0"/><text x="182" y="702" font-size="10" fill="#1f3d7a">USB, S/PDIF,</text><text x="182" y="716" font-size="10" fill="#1f3d7a">clocks</text>
  <rect x="262" y="678" width="182" height="120" rx="3" fill="#ffffff" stroke="#1f6f43"/><text x="270" y="762" font-size="10" fill="#14502f">Analogue in and out,</text><text x="270" y="776" font-size="10" fill="#14502f">mute relays</text>
  <rect x="262" y="806" width="80" height="44" rx="3" fill="#fff6c9" stroke="#a88b00"/><text x="270" y="832" font-size="10" fill="#5e4e00">Converter</text>

  <!-- Nucleo under the main board -->
  <rect x="62" y="738" width="190" height="150" rx="3" fill="none" stroke="#8a94a0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="70" y="760" font-size="10" fill="#5b6672">Nucleo-H755ZI-Q</text>
  <text x="70" y="774" font-size="10" fill="#5b6672">plugged in underneath</text>
  <text x="70" y="788" font-size="10" fill="#5b6672">(rev A only)</text>

  <!-- ribbon and front panel board -->
  <rect x="352" y="872" width="60" height="16" fill="#3a3a3a"/>
  <path d="M 382 888 C 382 930, 300 940, 300 986" fill="none" stroke="#9aa4ae" stroke-width="8"/>
  <text x="392" y="940" font-size="10" fill="#5b6672">ribbon</text>
  <rect x="52" y="986" width="400" height="10" fill="#20242a"/>
  <text x="62" y="978" font-size="11" fill="#20242a" font-weight="600">Control panel board, behind the front panel</text>
  <g fill="#e6e8eb" stroke="#0e1013">
    <rect x="72" y="996" width="18" height="36"/><rect x="232" y="996" width="18" height="36"/><rect x="286" y="996" width="18" height="36"/>
    <rect x="318" y="996" width="18" height="36"/><rect x="350" y="996" width="18" height="36"/><rect x="386" y="996" width="14" height="36"/><rect x="422" y="996" width="24" height="36"/>
  </g>
  <text x="252" y="1056" font-size="10" fill="#555" text-anchor="middle">knob shafts pass through the front panel and are fixed by their nuts</text>

  <!-- notes -->
  <g fill="#333" font-size="12">
    <text x="500" y="662" font-weight="600" font-size="13">Looks and feels like a product</text>
    <text x="500" y="684">Aluminium case, cut by CNC or waterjet; legends engraved</text>
    <text x="500" y="701">or laser-marked on the front and rear panels.</text>
    <text x="500" y="722">Controls grouped in signal order: input, effect, tone, output.</text>
    <text x="500" y="743">The largest knob is monitor volume; mute and dim sit above it.</text>
    <text x="500" y="764">Headphone jack on the front, next to its own volume.</text>

    <text x="500" y="806" font-weight="600" font-size="13">Reliability</text>
    <text x="500" y="828">Jacks and pots bolted to the panels, so no force on solder joints.</text>
    <text x="500" y="849">USB-C socket with through-hole anchors and ESD protection.</text>
    <text x="500" y="870">Outputs muted by relay until rails and clocks are good.</text>
    <text x="500" y="891">Watchdog, brown-out reset, settings stored with a checksum.</text>
    <text x="500" y="912">Firmware update over USB, so the case never needs opening.</text>

    <text x="500" y="954" font-weight="600" font-size="13">Rev B reuses all of it</text>
    <text x="500" y="976">Same case, same panels, same control board.</text>
    <text x="500" y="997">Only the main board changes: the MCU moves onto it</text>
    <text x="500" y="1014">and the Nucleo goes away.</text>
  </g>
</svg>
